# Builds the Craig Docker image for ARM64 (Oracle A1 / Ampere Altra) and
# pushes it to GitHub Container Registry (ghcr.io).
#
# No repository secrets are required for the build.
# All runtime secrets (Discord token, OAuth credentials, etc.) are supplied
# via a .env file on the host running docker-compose — see .env.example.

name: Build and Push Docker Image

on:
  push:
    branches: [master]
  workflow_dispatch:          # Allow manual triggers from the Actions tab

env:
  REGISTRY: ghcr.io
  # Becomes ghcr.io/nmt3325/craig automatically from github.repository
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    # Native ARM64 runner — no QEMU emulation, same arch as Oracle A1.
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: read
      packages: write           # Required to push to GHCR

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Authenticate to GHCR ──────────────────────────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      # ── 3. Compute image tags & labels ───────────────────────────────────
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Short commit SHA  →  ghcr.io/nmt3325/craig:sha-a1b2c3d
            type=sha,prefix=sha-,format=short
            # Branch name       →  ghcr.io/nmt3325/craig:master
            type=ref,event=branch
            # latest tag only on master pushes
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      # ── 4. Set up Docker Buildx (enables BuildKit secrets + layer cache) ─
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 5. Build & push ───────────────────────────────────────────────────
      # install.config.build (committed, non-secret stub) is copied into the
      # image at build time.  No BuildKit secrets or repository secrets needed.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          # Target ARM64 explicitly (matches the runner and Oracle A1)
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers in GitHub Actions cache between runs
          cache-from: type=gha
          cache-to: type=gha,mode=max
